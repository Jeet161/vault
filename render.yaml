services:
  # ── Control Plane API (Free Web Service) ──────────────────────
  - type: web
    name: vault-control-plane
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx tsc -p packages/shared/tsconfig.json && npx tsc -p packages/db/tsconfig.json && npx tsc -p apps/control-plane/tsconfig.json
    startCommand: node apps/control-plane/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false    # ← You will paste your NeonDB URL in Render dashboard
